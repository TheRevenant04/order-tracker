apiVersion: 1

providers:
  - name: order-tracker
    orgId: 1
    folder: Order Tracker
    type: file
    disableDeletion: false
    # Picks up edits to the dashboard on disk without a Grafana restart, so a
    # provisioned change can be reloaded.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
