# Tempo keeps traces in a local block store. The volume is disposable as far as
# this exercise goes; it only exists so traces survive a container restart.
server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Short blocks keep the query side responsive without a compactor backlog.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Span metrics are the reason traces can answer "how many requests are failing",
# which is what the dashboard leads with. Without this, request rates would only
# exist for the handful of instruments the app defines itself.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  processor:
    span_metrics:
      # Without these, span metrics only carry status_code as UNSET or ERROR,
      # which cannot tell a 404 apart from a 200.
      dimensions: [http.route, http.response.status_code]
  storage:
    # Without a local path the generator disables itself and no span metrics are
    # produced at all, even though remote_write is configured.
    path: /var/tempo/metrics/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
