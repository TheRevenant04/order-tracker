[project]
name = "order-tracker"
version = "0.1.0"
description = "A small order tracking service for an observability and incident response exercise"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
# The incident responder is a separate service with its own directory, so its
# tests live next to it and its package root is added to the path.
testpaths = ["tests", "incident-response/tests"]
pythonpath = [".", "incident-response"]
