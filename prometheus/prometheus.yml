global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # The collector's Prometheus exporter is the only metrics source: the app
  # pushes OTLP into the collector, and Prometheus pulls it back out here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
